<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Neon Snake: a tiny browser game built from a single prompt by an AI agent. Eat the glowing orbs, speed up every 5 orbs, don't hit the wall.">
<title>Neon Snake — built from one prompt</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0b0b16;
    color: #f2f2f7;
    font-family: "DejaVu Sans Mono", "Liberation Mono", monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 16px;
  }
  h1 {
    font-size: 30px;
    letter-spacing: 2px;
    color: #39ff14;
    text-shadow: 0 0 18px rgba(57, 255, 20, 0.55);
  }
  h1 span { color: #ff2d95; text-shadow: 0 0 18px rgba(255, 45, 149, 0.55); }
  .hud {
    display: flex;
    gap: 28px;
    font-size: 19px;
    background: #141428;
    border: 1px solid #26264d;
    border-radius: 10px;
    padding: 10px 22px;
  }
  .hud b { color: #39ff14; }
  .hud .pink b { color: #ff2d95; }
  #game {
    border: 2px solid #26264d;
    border-radius: 12px;
    box-shadow: 0 0 40px rgba(57, 255, 20, 0.12), 0 0 40px rgba(255, 45, 149, 0.10);
    max-width: 96vw;
    height: auto;
    background: #0b0b16;
  }
  #banner { font-size: 16px; color: #9d9db8; min-height: 22px; }
  .keys { font-size: 14px; color: #6d6d8a; }
  .keys kbd {
    background: #1c1c34;
    border: 1px solid #34345c;
    border-bottom-width: 3px;
    border-radius: 5px;
    padding: 1px 7px;
    color: #e8e8f2;
  }
  footer { font-size: 13px; color: #6d6d8a; }
  footer a { color: #ff2d95; }
</style>
</head>
<body>
  <h1>NEON <span>SNAKE</span></h1>
  <div class="hud">
    <div>SCORE <b id="score">0</b></div>
    <div class="pink">ORBS <b id="orbs">0</b></div>
    <div>SPEED <b id="speed">7.0/s</b></div>
  </div>
  <canvas id="game"></canvas>
  <div id="banner"></div>
  <div class="keys"><kbd>&larr;</kbd><kbd>&uarr;</kbd><kbd>&darr;</kbd><kbd>&rarr;</kbd> or WASD to steer &nbsp;·&nbsp; <kbd>R</kbd> restart &nbsp;·&nbsp; <kbd>P</kbd> pause</div>
  <footer>Built from one prompt by an AI agent — <a href="https://make.fun/bounty/post-x-the-agent-builds-a-game-from-20261122-1709">make.fun bounty</a></footer>
  <script type="module" src="./game.js"></script>
</body>
</html>
